syntax = "proto3";
package scheduler.v2;
// ============================================================
// SeatMesh v2 契约 —— epoch 2：对齐真实校园图书馆选座系统语义
// （平行实现；仅对齐接口形状与业务规则，不连接、不依赖任何真实系统）
//
// 修改规则：field 编号只增不删；语义变更需两端评审 + epoch +1。
//
// 全局常量（与本文件绑定，代码不得另立常量）：
//   时间粒度 15min；营业时间 06:00–22:00；SLOTS_PER_DAY = 64
//   bit i 表示 [06:00+15i, 06:00+15(i+1))
//   day_off ∈ [0,13]（0=今天）；ROLLING_DAYS = 14
//
//   入馆资格（对齐馆方规则）：
//     申请成功后 ENTRY_GRACE=30min 内入馆刷卡；
//     当日 08:00 前的申请统一保留至当日 08:30
//   中途离开保留期：11:00–13:00 / 17:00–19:00 离开保留 60min，其余 30min
//   取消/爽约后 CANCEL_COOLDOWN=30min 内不可再申请
//   申请开放时段：每日 06:00–21:45
//   超时未入馆（NO_SHOW）→ 当日不可再线上申请（网关硬规则）
//
//   预约单状态机（与真实系统六态对齐）：
//     PENDING_ENTRY 待入馆 → IN_LIBRARY 已入馆 → LEFT 已离馆
//                          ↘ BREAKAWAY 中途离开(保留期内) → IN_LIBRARY/LEFT
//     PENDING_ENTRY →(超时) NO_SHOW 超时未入馆
//     PENDING_ENTRY →(取消) CANCELLED 已取消
//     扩展态 GRANTED 候补授权（本系统特有，位图保持置位 60s）
//
//   座位寻址：内部 seat_id(int) 不变；对外维度 = 楼层 floor → 区域 area(sp)
//   → 座位编号 kid（如 "D005"），映射由元数据表承载（compat 层解析）。
//   region_id：0/1/2 = 三个校区（真实多校区语义，映射见部署配置）。
//
// 传输：写请求走 ZMQ DEALER→ROUTER（v0=JSON 帧，protobuf 就绪后切换）；
//       事件流走 PUB，首字节为 region_id 作订阅前缀；
//       非 leader 节点对写请求回 Redirect（帧类型 0x01）。
// 幂等：所有写请求携带 request_id(UUIDv4)，引擎 LRU 去重（上限 10 万条），
//       网关超时重试安全；重放返回 E_IDEMPOTENT_REPLAY + 原结果。
// 读己之写：写响应携带 applied_seq；客户端后续查询携带 min_applied_seq。
// ============================================================

// ---------- 通用 ----------
message RequestHeader {
  string request_id = 1;   // UUIDv4，幂等键
  int64  user_id    = 2;
  string trace_id   = 3;   // 16B hex，贯穿 网关→引擎→事件流
  int64  sent_at_ms = 4;   // 仅诊断，不参与仲裁
}

enum ErrorCode {
  OK = 0;
  E_CONFLICT          = 1;  // 时间冲突（conflict_mask 携带详情）
  E_SHED              = 2;  // 引擎过载，按 backoff_hint_ms 退避
  E_QUOTA             = 3;  // 配额不足（活跃预约=1 / 信用分不足 / 当日已爽约）
  E_NOT_FOUND         = 4;
  E_FORBIDDEN         = 5;  // 操作非本人资源（属主校验）
  E_WINDOW            = 6;  // 不在可操作窗口（入馆/离馆/取消/申请时段 06:00–21:45）
  E_COOLDOWN          = 7;  // 取消/爽约后 30min 冷却期内
  E_IDEMPOTENT_REPLAY = 8;  // 幂等重放，响应附带原结果
  E_STALE_ROUTE       = 9;
  E_SAGA_TIMEOUT      = 10;
}

// ---------- 写路径 ----------
message ReserveReq {
  RequestHeader header = 1;
  int32 seat_id   = 2;
  int32 day_off   = 3;
  int32 start_min = 4;     // 距 06:00 分钟数，15 的倍数；0..960=全天（对齐"当日资格"）
  int32 end_min   = 5;     // 不含端点；end-start ≤ 16 片
  bool  enqueue_if_conflict = 6;  // 冲突时是否加入候补队列
}
message ReserveResp {
  RequestHeader header = 1;
  oneof result {
    BookingCreated created  = 2;
    ConflictDetail conflict = 3;
    Shed           shed     = 4;   // 引擎过载，客户端按 hint 退避
  }
}
message BookingCreated {
  string booking_id        = 1;
  int64  entry_deadline_ms = 2;  // 入馆刷卡截止；超时 → NO_SHOW(当日禁约)+信用-10
  uint64 applied_seq       = 3;  // 本变更事件 seq；读己之写依据
}
message ConflictDetail {
  uint64 conflict_mask = 1;   // 与请求重叠的已占片，前端精确渲染
  string queue_ticket  = 2;   // 已入候补队列时非空
  int32  queue_pos     = 3;
}
message Shed { int64 backoff_hint_ms = 1; }

message CancelReq  { RequestHeader header = 1; string booking_id = 2; }
// 语义：时段开始前可取消（否则 E_WINDOW）；开始后离场走 Breakaway/Checkout。
// 取消成功后 30min 冷却（E_COOLDOWN）。
message CancelResp { RequestHeader header = 1; bool ok = 2; int64 credit_delta = 3; ErrorCode code = 4; }

// 入馆/中途离开刷卡（qr_token = 现场凭证，TOTP 30s 轮换，防远程代刷）
message CheckinReq  { RequestHeader header = 1; string booking_id = 2; string qr_token = 3;
                      bool leave = 4; }  // false=入馆；true=中途离开（进入保留期）
message CheckinResp { RequestHeader header = 1; bool ok = 2; ErrorCode code = 3; }

// 正式离馆（结清）：释放剩余时段（进候补授权流程）；保留期内离馆按剩余处理
message CheckoutReq  { RequestHeader header = 1; string booking_id = 2; }
message CheckoutResp { RequestHeader header = 1; bool ok = 2; uint64 released_mask = 3; ErrorCode code = 4; }

message GrantClaimReq  { RequestHeader header = 1; string queue_ticket = 2; }
message GrantClaimResp { RequestHeader header = 1; bool ok = 2; string booking_id = 3; ErrorCode code = 4; }

message AdminFreezeReq {   // 封楼等管理指令——也走日志，自动获得全序与持久化
  RequestHeader header = 1;
  int32 building_id = 2; int32 day_off = 3; uint64 mask = 4; string reason = 5;
}
message AdminResp { RequestHeader header = 1; bool ok = 2; ErrorCode code = 3; }

// ---------- Leader 发现 ----------
// 组内任意节点受理连接；非 leader 收到写请求直接回 Redirect（帧类型 0x01）。
// 网关缓存 leader_hint（TTL 5s）；hint 失效按组员列表轮询。
message Redirect { string leader_hint = 1; uint64 term = 2; }

// ---------- 读路径 ----------
// 常规查询由网关本地位图副本直接应答（见 docs/03），不打引擎。
// 仅当需要线性一致读时使用 LeaseRead（默认不用）。
message LeaseReadReq  { RequestHeader header = 1; int32 seat_id = 2; int32 day_off = 3; }
message LeaseReadResp { RequestHeader header = 1; uint64 bits = 2; uint64 applied_index = 3; }

// ---------- 副本冷启动 / 缺口恢复 ----------
// 网关重连先按 last_seq 续传 PUB；检测到 seq 跳跃 → 抖动 0–5s 后 SnapshotPull
// （防重连惊群）；拉取期间副本标记 DEGRADED，查询响应带 staleness 标注。
message SnapshotPullReq  { RequestHeader header = 1; uint64 since_seq = 2; }
message SeatBits         { int32 seat_id = 1; int32 day_off = 2; uint64 bits = 3; }
message SnapshotPullResp { RequestHeader header = 1; uint64 snapshot_seq = 2; repeated SeatBits seats = 3; }

// ---------- 事件流（引擎 PUB → 网关/大屏/AI/审计器 SUB） ----------
message Event {
  uint64 seq        = 1;   // 全局单调递增；断线按此续传，无空洞
  uint64 raft_index = 2;   // 产生该事件的日志下标（审计）
  string trace_id   = 3;
  int64  ts_ms      = 4;
  int32  region_id  = 5;   // 0/1/2 = 三校区
  int32  shard_id   = 6;   // v1 恒 0；v2 分片后全序 = (region_id, shard_id, seq)
  oneof payload {
    SeatChanged      seat_changed      = 10;
    BookingCreated   booking_created   = 11;
    BookingRejected  booking_rejected  = 12;
    BookingCancelled booking_cancelled = 13;
    BookingNoShow    booking_no_show   = 14;   // 超时未入馆（当日禁约+信用-10）
    BookingCheckedIn booking_checked_in = 15;  // 入馆刷卡
    BookingCheckedOut booking_checked_out = 16; // 正式离馆，含释放的剩余时段
    BookingBreakaway booking_breakaway = 17;   // 中途离开（保留期开始）
    BookingReturned  booking_returned  = 18;   // 保留期内返馆
    BookingDone      booking_done      = 19;   // 自然离馆（信用+1）
    GrantOffered     grant_offered     = 20;
    GrantExpired     grant_expired     = 21;
    AdminFreeze      admin_freeze      = 22;
    RouteTableEpoch  route_epoch       = 23;
    SagaCmd          saga_cmd          = 24;
  }
}
message SeatChanged {
  int32 seat_id = 1; int32 day_off = 2;
  uint64 bits   = 3;   // 变更后的完整位图；副本直接覆盖，无需 delta 合并
}
message BookingRejected {
  int64 user_id = 1; int32 seat_id = 2; int32 day_off = 3;
  uint64 conflict_mask = 4;
  ErrorCode code = 5;
  string detail  = 6;
}
message BookingCancelled { string booking_id = 1; int64 user_id = 2; int64 credit_delta = 3; }
message BookingNoShow    { string booking_id = 1; int64 user_id = 2; int64 credit_penalty = 3; }
message BookingCheckedIn { string booking_id = 1; }
message BookingBreakaway {
  string booking_id = 1; int64 user_id = 2;
  int64  keep_until_ms = 3;   // 保留期截止（11–13/17–19 点离馆为 60min，其余 30min）
}
message BookingReturned { string booking_id = 1; }
message BookingCheckedOut {
  string booking_id = 1; int64 user_id = 2;
  uint64 released_mask = 3;   // 释放的剩余时段 → 候补授权流程
}
message BookingDone      { string booking_id = 1; }
message GrantOffered {          // 候补授权：位图保持置位，旁人偷不走
  string queue_ticket = 1; int64 user_id = 2;
  int32 seat_id = 3; int32 day_off = 4; uint64 mask = 5;
  int64 grant_deadline_ms = 6;  // now + GRANT_TTL(60s)
}
message GrantExpired { string queue_ticket = 1; int32 next_queue_pos = 2; }
message AdminFreeze { int32 building_id = 1; int32 day_off = 2; uint64 mask = 3; string reason = 4; }
message RouteTableEpoch { uint64 epoch = 1; map<int32, int32> building_to_region = 2; }

// ---------- Saga：跨区域用户配额（座位区域 ↔ 用户区域） ----------
message SagaCmd {
  string saga_id = 1;      // 幂等键
  oneof step {
    SagaHoldUser   hold_user  = 2;   // T2：用户区域冻结配额
    SagaConfirm    confirm    = 3;   // T3：提交
    SagaCompensate compensate = 4;   // 补偿：释放配额
  }
}
message SagaHoldUser   { int64 user_id = 1; string booking_ref = 2; int64 timeout_ms = 3; }  // ≤ SAGA_TIMEOUT
message SagaConfirm    { string booking_ref = 1; }
message SagaCompensate { string booking_ref = 1; string cause = 2; }

// ---------- 信用分（控制面消费事件结算；引擎不仲裁信用） ----------
message CreditEntry {
  int64  user_id    = 1;
  int64  delta      = 2;   // 按时完成 +1；超时未入馆 -10；其余 0
  string booking_id = 3;
  uint64 event_seq  = 4;   // 来源事件 seq，结算幂等的依据
}
